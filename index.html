<!DOCTYPE html>
<html lang="ru">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="css/reset.css">
		<link rel="stylesheet" href="css/style.css">
		<title>Галерея фотографий</title>
	</head>

	<body>
		<div class="wrapper">

			<header class="header">
				<div class="header__container">
					<h1 class="header__title">Галерея</h1>
					<button type="submit" class="header__button">Загрузить</button>
				</div>
			</header>

			<main class="page">
				<div class="page__gallery gallery">
					<div class="gallery__container">
						<div class="gallery__items">
							<div class="gallery__item">
								<div class="gallery__img">
									<a href="#"><img src="img/gallery/01.webp" alt="Image"></a>
								</div>
								<div class="gallery__content">
									<h3 class="gallery__title">Горное озеро</h3>
									<h4 class="gallery__data">12 Июня 2026</h4>
								</div>
							</div>
							<div class="gallery__item">
								<div class="gallery__img">
									<a href="#"><img src="img/gallery/02.webp" alt="Image"></a>
								</div>
								<div class="gallery__content">
									<h3 class="gallery__title">Ночной город</h3>
									<h4 class="gallery__data">10 Июня 2026</h4>
								</div>
							</div>
							<div class="gallery__item">
								<div class="gallery__img">
									<a href="#"><img src="img/gallery/03.webp" alt="Image"></a>
								</div>
								<div class="gallery__content">
									<h3 class="gallery__title">Океанский пляж</h3>
									<h4 class="gallery__data">8 Июня 2026</h4>
								</div>
							</div>
							<div class="gallery__item">
								<div class="gallery__img">
									<a href="#"><img src="img/gallery/04.webp" alt="Image"></a>
								</div>
								<div class="gallery__content">
									<h3 class="gallery__title">Лесная тропа</h3>
									<h4 class="gallery__data">6 Июня 2026</h4>
								</div>
							</div>
							<div class="gallery__item">
								<div class="gallery__img">
									<a href="#"><img src="img/gallery/05.webp" alt="Image"></a>
								</div>
								<div class="gallery__content">
									<h3 class="gallery__title">Водопад</h3>
									<h4 class="gallery__data">4 Июня 2026</h4>
								</div>
							</div>
							<div class="gallery__item">
								<div class="gallery__img">
									<a href="#"><img src="img/gallery/06.webp" alt="Image"></a>
								</div>
								<div class="gallery__content">
									<h3 class="gallery__title">Городские улицы</h3>
									<h4 class="gallery__data">2 Июня 2026</h4>
								</div>
							</div>


						</div>
					</div>
				</div>
			</main>


		</div>
		<script src="js/script.js"></script>
	</body>

</html>
